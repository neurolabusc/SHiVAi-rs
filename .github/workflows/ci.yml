name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format, lint, and the conformance graph on CPU and Metal
        run: make lint test

  web:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium-headless-shell
      - name: Build, then boot and run the conformance graph on WebGPU (SwiftShader)
        run: npm run test:e2e
