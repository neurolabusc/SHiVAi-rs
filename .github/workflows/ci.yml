name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Format, lint, and the conformance graph on CPU and Metal
        run: make lint test

  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Format, lint, and the conformance graph on CPU (AVX2) and CUDA (skipped without a GPU)
        run: make lint test

  web:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium-headless-shell
      - name: Build, then boot and run the conformance graph on WebGPU (SwiftShader)
        run: npm run test:e2e
