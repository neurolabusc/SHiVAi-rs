[package]
name = "shivai-core"
description = "SHiVAi preprocessing, network execution plan, GPU kernels and post-processing"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["parallel", "sme"]
parallel = ["dep:rayon"]
sme = []

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rayon = { version = "1", optional = true }
serde_json = "1"

[build-dependencies]
cc = "1"
