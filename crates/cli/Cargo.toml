[package]
name = "shivai-rs"
description = "SHiVAi small vessel disease segmentation (PVS, WMH, lacunes) with Metal, CUDA or CPU inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shivai-core = { path = "../core" }
serde_json = "1"
sha2 = "0.10"
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
